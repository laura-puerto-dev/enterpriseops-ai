[project]
name = "enterpriseops-ai"
version = "0.1.0"
description = "Enterprise AI investigation platform combining structured enterprise data, RAG, controlled agentic workflows, evaluation, observability, and reliability engineering."
readme = "README.md"
authors = [
    { name = "Laura Puerto", email = "laura.puerto.martin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.15.4",
    "langgraph>=1.2.11",
    "openai>=3.14.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.54",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.mypy]
strict = true

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: enterpriseops
      POSTGRES_USER: enterpriseops
      POSTGRES_PASSWORD: enterpriseops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterpriseops -d enterpriseops"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
